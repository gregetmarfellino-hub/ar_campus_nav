name: Flutter and Android checks

on:
  push:
    branches: [feature/offline-visual-start, feature/offline-visual-v2, feature/offline-visual-v2-precision]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Flutter stable
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" config --no-analytics
          "$RUNNER_TEMP/flutter/bin/flutter" --version
      - name: Resolve dependencies
        id: dependencies
        run: flutter pub get
      - name: Analyze Dart errors
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run Flutter tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: flutter test --reporter expanded
      - name: Compile Android debug APK
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: flutter build apk --debug
